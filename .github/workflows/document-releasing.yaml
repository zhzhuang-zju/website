name: Version Document Releasing

on:
  workflow_dispatch:
    inputs:
      new_version:
        description: 'New release version (e.g. v1.18)'
        required: true
      prune_version:
        description: 'Version to prune (e.g. v1.12)'
        required: true

jobs:
  release-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout zhzhuang-zju/website
        uses: actions/checkout@v4

      - name: Create auto-action branch
        run: git checkout -b auto-action-${{ github.run_id }}

      - name: Pull latest code from karmada-io/website master
        run: |
          git remote add upstream https://github.com/karmada-io/website.git
          git fetch upstream main
          git reset --hard upstream/main

      - name: Update reference docs
        run: |
          cd infra/document-releasing
          hack/update-reference.sh

      - name: Release new version
        run: |
          cd infra/document-releasing
          hack/release.sh ${{ github.event.inputs.new_version }}

      - name: Prune old version
        run: |
          cd infra/document-releasing
          hack/prune-release.sh ${{ github.event.inputs.prune_version }}

      - name: Commit and create PR
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet; then
            echo "No changes detected, skipping PR creation."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release docs ${{ github.event.inputs.new_version }} and prune ${{ github.event.inputs.prune_version }}"

          if [ "${{ github.run_attempt }}" -gt 1 ]; then
            git push -f --set-upstream origin auto-action-${{ github.run_id }}
          else
            git push --set-upstream origin auto-action-${{ github.run_id }}
          fi

          gh pr create \
            --title "Release docs ${{ github.event.inputs.new_version }} and prune ${{ github.event.inputs.prune_version }}" \
            --body "**What type of PR is this?**

          /kind documentation

          **What this PR does / why we need it**:
          Automated document releasing by github-actions[bot].
          - Released new version: \`${{ github.event.inputs.new_version }}\`
          - Pruned old version: \`${{ github.event.inputs.prune_version }}\`

          **Which issue(s) this PR fixes**:
          Fixes #

          **Special notes for your reviewer**:
          Triggered by workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --repo ${{ github.repository }} \
            --base main \
            --head auto-action-${{ github.run_id }}
